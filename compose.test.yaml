services:
  broker:
    image: eclipse-mosquitto:2
    user: "1883:1883"
    volumes:
      - ./tests/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "mosquitto_pub", "-h", "127.0.0.1", "-t", "test/health", "-m", "ready", "-q", "1"]
      interval: 1s
      timeout: 3s
      retries: 20

  tests:
    build: .
    entrypoint: ["python", "-m", "unittest", "discover", "-s", "tests", "-v"]
    environment:
      MQTT_TEST_HOST: broker
    volumes:
      - ./tests:/app/tests:ro
    depends_on:
      broker:
        condition: service_healthy
    init: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

networks:
  default:
    internal: true
